# Manifesto de corretora. Valores marcados VERIFICAR devem ser lidos do servidor
# pelo adaptador e comparados com este arquivo na inicialização. Divergência é
# erro, não aviso.

id: exness-standard
label: Exness Standard (live)
account_type: standard
is_demo: false

symbol:
  resolve: ["XAUUSDm", "XAUUSD"]     # primeiro que existir no Market Watch
  contract_oz: 100
  digits: 3
  volume_min: 0.01
  volume_max: 200
  volume_step: 0.01
  stops_level_points: 0              # permite stop colado ao preço
  chart_price: bid                   # barras são bid; ask = bid + spread

execution:
  mode: market                       # sem requote, com slippage
  filling: [FOK, IOC]
  account_mode: hedging

account:
  currency: JPY
  profit_currency: USD
  margin_per_lot_jpy: 34265          # VERIFICAR — varia com preço e alavancagem

cost:
  spread_source: tick                # medido, nunca do anunciado
  commission_per_lot_side_usd: 0.0
  spread_observed_usd_per_oz: 0.24   # VERIFICAR — preencher pelo coletor

swap:
  buy_points: -523.8
  sell_points: 0.0
  triple_day: wednesday              # varia por corretora; alguns usam sexta

server:
  daily_break: "20:58-22:00"
  sunday_open: "22:01"
  # MEDIDO em 2026-08-09, nao derivado nem assumido. 271.380 pares de ticks
  # Exness x Dukascopy em 2026-07-15: a dispersao de preco cai para 0,13 USD/oz
  # em +0h e fica entre 5 e 16 nos demais offsets — minimo isolado por duas
  # ordens de grandeza, nao escolha entre candidatos proximos.
  #
  # Consequencias diretas: a pausa 20:58-22:00 do servidor E 20:58-22:00 UTC, e
  # o rollover das 22:00 do servidor e 22:00 UTC.
  #
  # AINDA POR VERIFICAR: se o offset muda com horario de verao. A medicao cobre
  # um unico dia de julho. Repetir em janeiro decide, e ate la nao assumir que
  # a constante vale o ano inteiro.
  timezone_offset: 0

policy:
  scalping_allowed: true             # VERIFICAR nos termos da corretora
